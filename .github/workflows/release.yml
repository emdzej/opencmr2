name: Release

# Triggered by plain semver tags (no "v" prefix): `git tag 0.1.0 && git push origin 0.1.0`; the tag must equal
# `project(OpenCMR2 VERSION ...)` in CMakeLists.txt.
# Builds the gasm module opencmr2-<version>.wasm and the gasm bundles (opencmr2.wasm + the released gasm-run,
# GASM_VERSION in tools/fetch-gasm-sdk.sh) for macOS, Linux x86_64/arm64 and Windows x86_64, smoke-tests each
# bundle on its own OS without game data, and attaches everything (with SHA-256 files) to a GitHub Release
# with .github/release-notes.md. No native app and never any game data.
# workflow_dispatch builds the same files as artifacts only (version 0.0.0-snapshot.<sha>).

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write   # to create the Release and upload assets

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="$GITHUB_REF_NAME"
            grep -Eq "^project\(OpenCMR2 VERSION $v( |\))" CMakeLists.txt ||
              { echo "tag $v does not match project(OpenCMR2 VERSION ...) in CMakeLists.txt" >&2; exit 1; }
          else
            v="0.0.0-snapshot.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: fetch wasi-sdk and the gasm C SDK
        run: tools/fetch-gasm-sdk.sh

      - name: build opencmr2.wasm
        run: |
          cmake -S . -B build-gasm -DOPENCMR2_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk"
          cmake --build build-gasm -j
          name="opencmr2-${{ steps.ver.outputs.version }}.wasm"
          cp build-gasm/opencmr2.wasm "$name"
          sha256sum "$name" > "$name.sha256"
          ls -l "$name"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencmr2-wasm
          path: opencmr2-*.wasm*
          retention-days: 14

  gasm-macos:
    needs: wasm
    runs-on: macos-latest   # iconutil, codesign (ad hoc)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opencmr2-wasm
          path: wasm
      - name: package
        run: |
          v=$(basename wasm/opencmr2-*.wasm .wasm); v=${v#opencmr2-}
          OPENCMR2_WASM=$(ls wasm/opencmr2-*.wasm) tools/package-gasm.sh "$v" macos-universal \
            "$(tools/fetch-gasm-runner.sh macos-universal)" dist
      - name: smoke test (no game data)
        run: tools/smoke-gasm-bundle.sh dist/opencmr2-gasm-*-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: opencmr2-gasm-macos-universal
          path: dist/opencmr2-gasm-*.zip*
          retention-days: 14

  gasm-package:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opencmr2-wasm
          path: wasm
      - name: package (Linux x86_64 and arm64, Windows x86_64)
        run: |
          v=$(basename wasm/opencmr2-*.wasm .wasm); v=${v#opencmr2-}
          for p in linux-x86_64 linux-arm64 windows-x86_64; do
            OPENCMR2_WASM=$(ls wasm/opencmr2-*.wasm) tools/package-gasm.sh "$v" "$p" "$(tools/fetch-gasm-runner.sh "$p")" "dist/$p"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: opencmr2-gasm-linux-x86_64
          path: dist/linux-x86_64/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: opencmr2-gasm-linux-arm64
          path: dist/linux-arm64/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: opencmr2-gasm-windows-x86_64
          path: dist/windows-x86_64/*
          retention-days: 14

  gasm-smoke-linux:
    needs: gasm-package
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opencmr2-gasm-linux-${{ matrix.arch }}
          path: dist
      - name: runtime libraries (ALSA)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2t64
      - name: smoke test (no game data)
        run: tools/smoke-gasm-bundle.sh dist/opencmr2-gasm-*-linux-${{ matrix.arch }}.tar.gz

  gasm-smoke-windows:
    needs: gasm-package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opencmr2-gasm-windows-x86_64
          path: dist
      - name: smoke test (no game data)
        shell: pwsh
        env:
          OPENCMR2_NO_PAUSE: '1'
        run: |
          $zip = Get-ChildItem dist/opencmr2-gasm-*-windows-x86_64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath unpacked
          $d = (Get-ChildItem unpacked -Directory | Select-Object -First 1).FullName
          foreach ($f in 'gasm-run.exe', 'opencmr2.wasm', 'OpenCMR2.cmd', 'opencmr2.ps1', 'README.txt', 'LICENSE.txt', 'LICENSE-gasm.txt') {
            if (-not (Test-Path (Join-Path $d $f))) { throw "missing $f" }
          }
          # No data: OpenCMR2's clean error, exit code 1 (not a crash).
          $out = & "$d\gasm-run.exe" "$d\opencmr2.wasm" --headless 5 --mute 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $out
          if ($rc -ne 1) { throw "gasm-run without data: exit $rc, expected 1" }
          if ($out -notmatch 'game data not found') { throw "no 'game data not found' message" }
          # The launcher (no dialogs: OPENCMR2_GAME / --dry-run, scratch APPDATA and LOCALAPPDATA).
          $env:APPDATA = Join-Path $PWD 'appdata'; $env:LOCALAPPDATA = Join-Path $PWD 'localappdata'
          $help = & "$d\OpenCMR2.cmd" --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'OpenCMR2') { throw '--help' }
          # fakes: the CD's files (a space in the path), an installed game, an image (goes to the game as asset cd), and what must be refused
          New-Item -ItemType Directory -Force 'my cd\Game', 'my cd\FrontEnd', installed\Game, installed\FrontEnd, empty, wrongexe\Game, wrongexe\FrontEnd, nocab\Game, nocab\FrontEnd, nofe\Game | Out-Null
          New-Item -ItemType File -Force 'my cd\data1.hdr', 'my cd\data1.cab', 'wrongexe\CMR2.exe', 'nocab\data1.hdr', 'nofe\data1.hdr', 'nofe\data1.cab', 'CMR2 CD.iso', CMR2.cue | Out-Null
          $f = [IO.File]::Create((Join-Path $PWD 'installed\CMR2.exe')); $f.SetLength(1228800); $f.Close()
          $env:OPENCMR2_GAME = Join-Path $PWD 'installed'
          $cmd = & "$d\OpenCMR2.cmd" --dry-run | Out-String
          if ($LASTEXITCODE -ne 0 -or $cmd -notmatch '--asset-dir') { throw 'dry run with an installed folder' }
          $env:OPENCMR2_GAME = Join-Path $PWD 'my cd'
          $cmd = & "$d\OpenCMR2.cmd" --dry-run --mute | Out-String
          $cmd
          if ($LASTEXITCODE -ne 0 -or $cmd -notmatch '--asset-dir' -or $cmd -notmatch '--mute') { throw 'dry run with the CD files' }
          $env:OPENCMR2_GAME = Join-Path $PWD 'CMR2 CD.iso'
          $cmd = & "$d\OpenCMR2.cmd" --dry-run | Out-String
          $cmd
          if ($LASTEXITCODE -ne 0 -or $cmd -notmatch 'cd=' -or $cmd -match '--asset-dir') { throw 'dry run with an .iso' }
          foreach ($bad in 'empty', 'wrongexe', 'nocab', 'nofe', 'CMR2.cue', 'missing') {
            $env:OPENCMR2_GAME = Join-Path $PWD $bad
            & "$d\OpenCMR2.cmd" --dry-run 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -ne 2) { throw "$bad accepted (exit $LASTEXITCODE, expected 2)" }
          }
          if (Test-Path (Join-Path $env:APPDATA 'OpenCMR2\data-location')) { throw 'a dry run saved the data location' }
          $global:LASTEXITCODE = 0
          'PASS'

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wasm, gasm-macos, gasm-package, gasm-smoke-linux, gasm-smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "OpenCMR2 $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
